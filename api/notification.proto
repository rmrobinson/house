syntax = "proto3";

package faltung.house.api;

option go_package = "github.com/rmrobinson/house/api";

// SendMessageRequest asks the notification service to deliver a message to
// one or more recipients. recipient_ids name people (opaque IDs the
// notification service resolves internally), never addresses or channel
// types - the caller doesn't know or choose how a given recipient is
// actually reached (email, push, ...); that mapping, and which channel
// types exist at all, is entirely the notification service's own concern.
// An unknown recipient_id is skipped rather than failing the whole request.
message SendMessageRequest {
  repeated string recipient_ids = 1;
  string subject = 2;
  string body = 3;
  // MIME type of body, e.g. "text/plain" or "text/html". Empty means
  // "text/plain".
  string content_type = 4;
  // Files to send with the message. The total size of all data is capped
  // (see service/notification); channels that can't carry attachments
  // deliver the message without them.
  repeated Attachment attachments = 5;
}

// Attachment is a file delivered with a message. An attachment with a
// content_id can be referenced from an HTML body as <img src="cid:...">,
// and is shown inline there; others arrive as ordinary attachments.
message Attachment {
  // Display name, e.g. "back-yard.jpg".
  string filename = 1;
  // MIME type of data, e.g. "image/jpeg". Required.
  string content_type = 2;
  // The file's bytes. Required, and must not be empty.
  bytes data = 3;
  // Optional Content-ID (without angle brackets) HTML bodies refer to with a
  // cid: URL. Must be unique within a request.
  string content_id = 4;
}

message SendMessageResponse {
}

service NotificationService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {}
}
