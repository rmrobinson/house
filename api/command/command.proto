syntax = "proto3";

package faltung.house.api.command;

option go_package = "github.com/rmrobinson/house/api/command";

import "api/command/app.proto";
import "api/command/brightness.proto";
import "api/command/channel.proto";
import "api/command/colour.proto";
import "api/command/media.proto";
import "api/command/mode.proto";
import "api/command/movement.proto";
import "api/command/onoff.proto";
import "api/command/position.proto";
import "api/command/speed.proto";
import "api/command/thermostat.proto";
import "api/command/time.proto";
import "api/command/timer.proto";
import "api/command/toggle.proto";
import "api/command/ventilation.proto";
import "api/command/volume.proto";

// Command contains the information required to request an action be taken on a device.
message Command {
  // The unique ID of the device that is going to be changed.
  string device_id = 1;

  // Unique ID for this command, generated by the caller. Required when
  // executing asynchronously so the result can be correlated on the update
  // stream. A UUID is recommended; the bridge treats it as opaque.
  string id = 2;

  // The device version this command was composed against, from Device.version.
  // If set, the bridge MUST reject the command with FAILED_PRECONDITION if the
  // device has changed since. Empty means execute unconditionally.
  string version = 3;

  // The specifics of the command we're executing.
  // Control of these is done via spending relevant 'Command' entities to the Bridge.
  // Each device has a set of supported commands; these can be seen in the comments on the specific device.
  oneof details {
    faltung.house.api.command.OnOff on_off = 100;
    faltung.house.api.command.BrightnessAbsolute brightness_absolute = 101;
    faltung.house.api.command.BrightnessRelative brightness_relative = 102;
    faltung.house.api.command.Time time = 103;
    faltung.house.api.command.Position position = 104;
    faltung.house.api.command.Movement movement = 105;
    faltung.house.api.command.Toggle toggle = 106;
    faltung.house.api.command.Mode mode = 107;
    faltung.house.api.command.Timer timer = 108;
    faltung.house.api.command.Speed speed = 109;
    faltung.house.api.command.Playback playback = 110;
    faltung.house.api.command.SeekAbsolute seek_absolute = 111;
    faltung.house.api.command.SeekRelative seek_relative = 112;
    faltung.house.api.command.VolumeAbsolute volume_absolute = 113;
    faltung.house.api.command.VolumeRelative volume_relative = 114;
    faltung.house.api.command.Mute mute = 115;
    faltung.house.api.command.AppLaunch app_launch = 116;
    faltung.house.api.command.AppClose app_close = 117;
    faltung.house.api.command.ChannelAbsolute channel_absolute = 118;
    faltung.house.api.command.ChannelRelative channel_relative = 119;
    faltung.house.api.command.SetThermostatMode set_thermostat_mode = 120;
    faltung.house.api.command.SetTemperature set_temperature = 121;
    faltung.house.api.command.SetHeatCoolSetpoints set_heat_cool_setpoints = 122;
    faltung.house.api.command.SetVentilation set_ventilation = 123;
    faltung.house.api.command.SetComfortProfile set_comfort_profile = 124;
    faltung.house.api.command.SetHumidity set_humidity = 125;
    faltung.house.api.command.Colour colour = 126;
  }
}
