syntax = "proto3";

package faltung.house.api.command;

option go_package = "github.com/rmrobinson/house/api/command";

import "api/trait/thermostat.proto";

message SetThermostatMode {
  faltung.house.api.trait.Thermostat.Mode mode = 1;
}

message SetTemperature {
  // Single-setpoint form, used when target_mode is HEAT or COOL.
  float setpoint_celsius = 1;
}

message SetHeatCoolSetpoints {
  // Dual-setpoint form, used when target_mode is AUTO.
  float heat_setpoint_celsius = 1;
  float cool_setpoint_celsius = 2;
}

message SetComfortProfile {
  // Must be one of trait.Thermostat.Attributes.comfort_profiles. Switches the thermostat's
  // active climate (e.g. "Home"/"Away"/"Sleep") rather than writing a raw setpoint - the
  // thermostat applies whatever setpoint is configured for that profile itself, and honors its
  // own hold-duration preference for how long the switch persists.
  string profile_name = 1;
}

message SetHumidity {
  float target_humidity_percent = 1;
}
