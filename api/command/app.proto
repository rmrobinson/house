syntax = "proto3";

package faltung.house.api.command;

option go_package = "github.com/rmrobinson/house/api/command";

// AppLaunch commands a device with the App trait to launch the given application.
message AppLaunch {
  // Platform-specific identifier of the application to launch (e.g. a Cast
  // receiver app ID).
  string application_id = 1;
}

// AppClose commands a device with the App trait to close the foreground application, returning
// the device to its home/idle state.
message AppClose {}
