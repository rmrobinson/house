syntax = "proto3";

package faltung.house.api;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rmrobinson/house/api";

// GetSeriesRequest asks for one numeric attribute of one device - or, with
// device_ids, of several combined into one series - over a time range,
// thinned to at most max_points for charting.
message GetSeriesRequest {
  // device_id selects a single device. Set exactly one of device_id and
  // device_ids.
  string device_id = 1;
  // attribute names the value as "<trait>.<leaf>" - the trait's field name on
  // the device message followed by the leaf's name within its trait state,
  // with no leading device-kind segment. This is the same key convention as
  // the policy engine's GetState, e.g. "air_quality.co2_ppm" or
  // "air_properties.temperature_c". A nested leaf keeps its own dots
  // ("light.colour.hue"): only the first dot separates trait from leaf.
  string attribute = 2;
  // start is required.
  google.protobuf.Timestamp start = 3;
  // end defaults to now when unset.
  google.protobuf.Timestamp end = 4;
  // max_points bounds the number of points returned; the series is
  // downsampled (mean per window) to fit. Zero means a server default, and
  // the server caps it.
  int32 max_points = 5;

  // device_ids selects several devices whose series are combined, window by
  // window, into one (see combine): e.g. the temperature of every indoor
  // sensor as an average, or every metered device's power as a total. Each
  // device is first averaged over the window on its own, so a device that
  // reports more often doesn't outweigh one that reports less. A window in
  // which a device recorded nothing contributes nothing for that device, which
  // understates a sum, so keep windows wider than the 5 minute heartbeat.
  // Every device should report the attribute as the same kind of value (all
  // numeric, or all bool): in the long-term hourly store a numeric leaf has a
  // mean and a bool only a last, and the request uses the mean when any device
  // has one, which leaves bool-only devices out of the result.
  // Duplicates are ignored; the server caps the count and each id's length.
  repeated string device_ids = 6;
  Combine combine = 7;

  // Combine is how the per-device window values are merged into one point.
  enum Combine {
    // COMBINE_UNSPECIFIED is the same as COMBINE_MEAN.
    COMBINE_UNSPECIFIED = 0;
    COMBINE_MEAN = 1;
    COMBINE_MAX = 2;
    COMBINE_SUM = 3;
  }
}

message SeriesPoint {
  google.protobuf.Timestamp time = 1;
  double value = 2;
}

message GetSeriesResponse {
  // points are in ascending time order. Empty (not an error) when the device
  // has no recorded values for the attribute in the range - including when
  // the attribute isn't numeric.
  repeated SeriesPoint points = 1;
  // resolution is the width of the window each point averages over. Ranges
  // that reach back into the long-term (hourly) store can't be finer than
  // one hour regardless of max_points.
  google.protobuf.Duration resolution = 2;
}

// MetricsService serves recorded device history. It is read-only; writes go
// through metricsd's own consumption of the update stream.
service MetricsService {
  rpc GetSeries(GetSeriesRequest) returns (GetSeriesResponse) {}
}
