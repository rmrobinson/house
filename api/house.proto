syntax = "proto3";

package faltung.house.api;

option go_package = "github.com/rmrobinson/house/api";

import "api/device/device.proto";
import "google/protobuf/empty.proto";

// AggregationConfig selects, per metric, how a room's linked devices are
// combined into that room's Properties. See Room.Config.aggregation for the
// documented default per metric.
message AggregationConfig {
  enum Strategy {
    STRATEGY_UNSPECIFIED = 0;
    LATEST = 1;
    AVERAGE = 2;
    MIN = 3;
    MAX = 4;
    SUM = 5;
    ANY = 6; // boolean OR - the default for occupancy
  }
  Strategy occupancy_strategy = 1;   // default ANY
  Strategy temperature_strategy = 2; // default AVERAGE
  Strategy light_strategy = 3;       // default AVERAGE
  // Also governs Properties.co2_ppm/voc_ppb/radon_bq_m3 below - one strategy
  // for every air-quality submetric a room's sensors happen to report,
  // rather than one enum field per submetric.
  Strategy air_quality_strategy = 4; // default AVERAGE
  Strategy power_strategy = 5;       // default SUM
}

message Room {
  message Config {
    string name = 1;
    // TODO: use an enum for the Room type
    int32 type = 2;
    // Overrides the per-metric aggregation defaults below. Unset means every
    // metric uses its documented default strategy.
    optional AggregationConfig aggregation = 3;
  }
  // Properties holds values computed server-side from the room's linked
  // devices, per AggregationConfig - not independently settable by clients.
  // Unset means no linked device currently reports that metric. Sourced
  // from any linked device, regardless of kind, that carries one of the
  // relevant api/trait/*.proto measurement traits directly on its
  // Device.details message (see service/house/aggregation.go's
  // extractDeviceTraits) - not Sensor-kind devices only.
  message Properties {
    // Field 2 was briefly shipped (and deployed) as temperature_f
    // (Fahrenheit) before being retired same-day in favour of
    // temperature_c below - reserved rather than reused, so a client built
    // against that short-lived field 2 gets a clear "field removed" signal
    // instead of silently misreading a Celsius value as Fahrenheit.
    reserved 2;
    reserved "temperature_f";

    optional bool occupied = 1;
    optional int32 light_level_lux = 3;
    optional int32 air_quality_index = 4;
    optional double power_draw_w = 5;
    optional int32 co2_ppm = 6;
    optional int32 voc_ppb = 7;
    optional int32 radon_bq_m3 = 8;
    optional double temperature_c = 9;
  }

  string id = 1;
  Config config = 2;
  Properties properties = 3;
  string floor_id = 4;
  string version = 5;
  // Denormalized from the owning Floor for query convenience - set by the
  // server from floor_id at creation, not independently settable.
  string building_id = 6;

  repeated faltung.house.api.device.Device devices = 11;
}

message Floor {
  string id = 1;
  string name = 2;       // "First Floor", "Full Yard"
  int32 sort_order = 3;  // controls level-list position; not physical elevation
  string building_id = 4;
  string version = 5;    // optimistic concurrency
}

message Building {
  message Config {
    string name = 1;
    string tz = 2;
    double lat = 3;
    double lon = 4;
    // The values mode/SetHouseModeRequest.mode may be set to, e.g. ["home",
    // "away", "vacation"]. CreateBuilding defaults this to that same list
    // when left empty; UpdateBuilding replaces it wholesale like every other
    // Config field - an empty list there means no mode is settable until
    // reconfigured.
    repeated string available_modes = 5;
  }
  // State holds values not independently settable via UpdateBuilding -
  // either computed server-side (occupied) or settable only through their
  // own dedicated RPC (mode, via SetHouseMode), the same "Config vs.
  // server/command-owned" split Room.Properties draws against Room.Config.
  message State {
    // True if any room belonging to this building has had motion (per that
    // room's Properties.occupied - see AggregationConfig.occupancy_strategy)
    // within the last occupied window (10 minutes, not yet configurable) -
    // computed server-side from room aggregation, not independently
    // settable. Unset if no room in the building has ever reported any
    // occupancy signal at all, the same "no data yet" contract
    // Room.Properties.occupied uses.
    optional bool occupied = 1;
    // The currently active mode, one of Config.available_modes, or "" if
    // never set. Set via SetHouseMode, not UpdateBuilding.
    string mode = 2;
    // Weather station info?
  }

  string id = 1;
  Config config = 2;
  State state = 3;
  string version = 4;
}

/* ----- Building ----- */
message ListBuildingsRequest {
}
message GetBuildingRequest {
  string id = 1;
}
message CreateBuildingRequest {
  Building.Config config = 1;
}
message UpdateBuildingRequest {
  string id = 1;
  string version = 2;
  Building.Config config = 10;
}
message DeleteBuildingRequest {
  string id = 1;
  string version = 2;
}

// SetHouseMode sets a building's current mode. mode must be one of the
// building's Config.available_modes, or "" to clear it - any other value is
// rejected. Not guarded by Building.version: mode is State, not Config, and
// changing it doesn't race with a concurrent Config edit the way
// UpdateBuilding's version check protects against.
message SetHouseModeRequest {
  string building_id = 1;
  string mode = 2;
}

/* ----- Floor ----- */
message ListFloorsRequest {
  string building_id = 1;
}
message GetFloorRequest {
  string id = 1;
}
message CreateFloorRequest {
  string building_id = 1;
  string name = 2;
  int32 sort_order = 3;
}
message UpdateFloorRequest {
  string id = 1;
  string version = 2;
  string name = 10;
  int32 sort_order = 11;
}
message DeleteFloorRequest {
  string id = 1;
  string version = 2;
}

/* ----- Room ----- */
message ListRoomsRequest {
  // At least one of these should be set. If floor_id is set, rooms are
  // scoped to that floor; otherwise all rooms across every floor of
  // building_id are returned.
  optional string building_id = 1;
  optional string floor_id = 2;
}
message GetRoomRequest {
  string id = 1;
}
message CreateRoomRequest {
  string floor_id = 1;
  Room.Config config = 2;
}
message UpdateRoomRequest {
  string id = 1;
  string version = 2;
  Room.Config config = 10;
}
message DeleteRoomRequest {
  string id = 1;
  string version = 2;
}

/* ----- Device <-> Room linking -----
 * Modeled as a standalone mapping, not a field on Device - a device can
 * operate standalone and shouldn't carry room state in its own config. */
message DeviceRoomLink {
  string device_id = 1;
  string room_id = 2;
  // Opaque token minted fresh on every link/move, the same optimistic
  // concurrency contract as Building/Floor/Room.version - see
  // LinkDeviceRequest.version.
  string version = 3;
}

message LinkDeviceRequest {
  string device_id = 1;
  string room_id = 2;
  // If set, must match the device's current link version (DeviceRoomLink.
  // version) or the request is rejected - the same optimistic concurrency
  // contract as Update*Request.version. Left empty for a device's first-ever
  // link, which has no prior version to race against.
  string version = 3;
}
message LinkDeviceResponse {
  DeviceRoomLink link = 1;
  // Unset if the device was previously unlinked.
  optional string previous_room_id = 2;
}

message UnlinkDeviceRequest {
  string device_id = 1;
}

message ListDeviceLinksRequest {
  optional string building_id = 1;
  optional string room_id = 2;
  optional string device_id = 3;
}

/* ----- House-level update stream -----
 * Distinct from BridgeService.StreamUpdates (raw, per-device): this reports
 * only server-computed state for the requested building - the synthetic/
 * aggregated Room.Properties (see AggregationConfig) for each of its rooms,
 * and the building's own Building.State - whenever either changes. A client
 * wanting raw per-device state too subscribes to BridgeService.StreamUpdates
 * separately. */
message StreamHouseUpdatesRequest {
  string building_id = 1;
}
message RoomUpdate {
  string room_id = 1;
  // Always set to the room's current computed value on the field(s) that
  // changed since the last update sent for it - never a partial diff of
  // just what changed, so a client can always replace its cached
  // Properties for room_id wholesale rather than merge.
  Room.Properties properties = 2;
}
// BuildingUpdate reports building_id's current State whenever it changes -
// either occupied (see Building.State.occupied's doc comment) or mode (set
// via SetHouseMode). Always the building's full current State, the same
// "wholesale, not a partial diff" contract RoomUpdate.properties follows.
message BuildingUpdate {
  string building_id = 1;
  Building.State state = 2;
}
// HouseUpdate is StreamHouseUpdates' message type: a change to either one
// room's Properties or the building's own State, both scoped to the
// request's building_id.
message HouseUpdate {
  oneof update {
    RoomUpdate room = 1;
    BuildingUpdate building = 2;
  }
}

service HouseService {
  // Building
  rpc ListBuildings(ListBuildingsRequest) returns (stream Building) {}
  rpc GetBuilding(GetBuildingRequest) returns (Building) {}
  rpc CreateBuilding(CreateBuildingRequest) returns (Building) {}
  rpc UpdateBuilding(UpdateBuildingRequest) returns (Building) {}
  rpc DeleteBuilding(DeleteBuildingRequest) returns (google.protobuf.Empty) {}

  // Sets a building's current mode - see SetHouseModeRequest.
  rpc SetHouseMode(SetHouseModeRequest) returns (Building) {}

  // Floor
  rpc ListFloors(ListFloorsRequest) returns (stream Floor) {}
  rpc GetFloor(GetFloorRequest) returns (Floor) {}
  rpc CreateFloor(CreateFloorRequest) returns (Floor) {}
  rpc UpdateFloor(UpdateFloorRequest) returns (Floor) {}
  rpc DeleteFloor(DeleteFloorRequest) returns (google.protobuf.Empty) {}

  // Room
  rpc ListRooms(ListRoomsRequest) returns (stream Room) {}
  rpc GetRoom(GetRoomRequest) returns (Room) {}
  rpc CreateRoom(CreateRoomRequest) returns (Room) {}
  rpc UpdateRoom(UpdateRoomRequest) returns (Room) {}
  rpc DeleteRoom(DeleteRoomRequest) returns (google.protobuf.Empty) {}

  // Device <-> Room linking. LinkDevice upserts keyed on device_id, so
  // moving a device to a new room is a single call, not unlink-then-link.
  rpc LinkDevice(LinkDeviceRequest) returns (LinkDeviceResponse) {}
  rpc UnlinkDevice(UnlinkDeviceRequest) returns (google.protobuf.Empty) {}
  rpc ListDeviceLinks(ListDeviceLinksRequest) returns (stream DeviceRoomLink) {}

  // House-level update stream - see StreamHouseUpdatesRequest.
  rpc StreamHouseUpdates(StreamHouseUpdatesRequest) returns (stream HouseUpdate) {}
}
