syntax = "proto3";

package faltung.house.api.trait;

option go_package = "github.com/rmrobinson/house/api/trait";

// App describes the part of the device running an application.
// This is intended to be utilized for devices which can support a single active app at any one time;
// it can also be used in lieu of a 'scene' for devices with scene selection.
message App {
  // Details of a single app which could be running.
  message Instance {
    string id = 1;
    string name = 2;
    string version = 3;
    string type = 4;
  }

  message Attributes {
    // If true, control of the device application property is possible.
    // If false, control is not allowed and the property is read-only.
    bool can_control = 1;

    // The list of potential applications to select from.
    repeated Instance applications = 2;
  }
  message State {
    // The ID of the active application. Can be unset or empty if no
    // application is running.
    string application_id = 1;
    // Human-readable name of the active application, where the device reports
    // one. Devices that cannot enumerate their available applications will
    // leave Attributes.applications empty and populate this instead.
    optional string application_name = 2;
    // Free-form status the application is reporting about itself, e.g.
    // "Casting: <album>". Display only; format is not stable.
    optional string application_status = 3;
  }

  Attributes attributes = 1;
  State state = 2;
}
