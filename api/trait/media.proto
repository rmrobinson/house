syntax = "proto3";

package faltung.house.api.trait;

option go_package = "github.com/rmrobinson/house/api/trait";

import "google/protobuf/timestamp.proto";

// Media describes the part of a device which manages the playback of media.
message Media {
  // PlaybackState includes the possible states of the media controlled by a media player.
  enum PlaybackState {
    PS_UNSPECIFIED = 0;
    PS_PLAYING = 1;
    PS_PAUSED = 2;
    PS_FAST_FORWARD = 3;
    PS_REWIND = 4;
    PS_BUFFERING = 5;
    PS_STOPPED = 6;
    PS_COMPLETED = 7;
  }
  // DeviceState includes the possible states of the media player itself.
  enum DeviceState {
    DEVICE_STATE_UNSPECIFIED = 0;
    DEVICE_STATE_INACTIVE = 1;
    DEVICE_STATE_ACTIVE = 2;
  }

  // Type includes the type of media being played.
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_SHOW = 1;
    TYPE_MOVIE = 2;
    TYPE_SONG = 3;
    TYPE_GENERIC = 4;
  }

  message ShowDetails {
    string id = 1;
    string episode_title = 2;
    string episode_summary = 3;
    int32 release_year = 4;
    string content_rating = 5;
    optional string art_url = 6;

    string season_id = 10;
    string season_title = 11;

    string show_id = 20;
    string show_title = 21;
  }

  message MovieDetails {
    string id = 1;
    string title = 2;
    string summary = 3;
    string studio = 4;
    int32 release_year = 5;
    string content_rating = 6;
    optional string art_url = 7;
  }

  message SongDetails {
    string id = 1;
    string song_name = 2;
    repeated string artists = 3;
    string album_name = 4;
    int32 release_year = 5;
    optional string album_art_url = 6;

    optional string playlist_id = 10;
    optional string playlist_name = 11;
    optional string playlist_art_url = 12;
  }

  // GenericDetails covers media that does not decompose into a show, movie or
  // song — podcasts, radio streams, and content from sources that report only
  // minimal metadata.
  message GenericDetails {
    string id = 1;
    string title = 2;
    string subtitle = 3;
    optional string art_url = 4;
  }

  message Attributes {
    // True if any control action is possible on this media player. Consumers
    // read this first to decide whether to render controls at all, then read
    // the specific can_* flags below to decide which controls to show.
    bool can_control = 1;

    optional bool can_pause = 2;
    optional bool can_seek = 3;
    optional bool can_skip_forward = 4;
    optional bool can_skip_backward = 5;
  }
  message State {
    // The current state of the media playing device.
    DeviceState device_state = 1;
    // The current state of the media being played.
    PlaybackState playback_state = 2;
    // The type of media being played
    Type media_type = 3;

    optional ShowDetails show_details = 10;
    optional MovieDetails movie_details = 11;
    optional SongDetails song_details = 12;
    optional GenericDetails generic_details = 13;

    // The length of the media being played, in seconds.
    double playback_length_s = 20;
    // The current position of the media, in seconds.
    double playback_position_s = 21;
    // When playback_position_s was last sampled by the bridge.
    //
    // Media devices generally push state on change rather than continuously,
    // so playback_position_s goes stale between pushes. Consumers displaying
    // a progress bar should extrapolate from this timestamp against wall
    // clock while playback_state is PS_PLAYING, rather than polling the
    // bridge.
    google.protobuf.Timestamp playback_position_updated_at = 22;
  }

  Attributes attributes = 1;
  State state = 2;
}
