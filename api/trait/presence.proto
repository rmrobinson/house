syntax = "proto3";

package faltung.house.api.trait;

option go_package = "github.com/rmrobinson/house/api/trait";

// Presence describes the detection of a person or motion in a given location.
message Presence {
  message Attributes {
    // can_control is absent since this is a read only trait.
  }
  message State {
    // Has motion been detected?
    bool motion_detected = 1;
    // Has occupancy (debounced presence, not raw motion) been detected? Optional since not every
    // accessory reports both signals - some only report motion, some only occupancy.
    optional bool occupancy_detected = 2;
  }

  Attributes attributes = 1;
  State state = 2;
}
