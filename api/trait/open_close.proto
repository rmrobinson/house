syntax = "proto3";

package faltung.house.api.trait;

option go_package = "github.com/rmrobinson/house/api/trait";

// OpenClose describes the part of a device which is either open or closed, e.g. a garage door.
// It reports only the resting position: a door part-way along its travel is OPEN, since most
// hardware only has a closed-position contact and so can't tell "moving" from "fully open".
message OpenClose {
  enum Position {
    POSITION_UNSPECIFIED = 0;
    POSITION_OPEN = 1;
    POSITION_CLOSED = 2;
  }

  message Attributes {
    // If true, command.OpenClose may be sent. If false the device only reports its position.
    bool can_control = 1;
  }
  message State {
    // POSITION_UNSPECIFIED until the device has reported at least once.
    Position position = 1;
  }

  Attributes attributes = 1;
  State state = 2;
}
