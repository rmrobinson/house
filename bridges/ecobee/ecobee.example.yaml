bridge:
  id: "<bridge ID>"
  listen_port: 17011
  # Optional: mutual TLS for this bridge's gRPC server. Leave all three
  # blank (the default) to serve plaintext gRPC. cert_file/key_file are
  # this bridge's own identity; client_ca_file is the CA (e.g. step-ca's
  # root) trusted to sign a connecting client's (facade's) certificate.
  tls:
    cert_file: ""
    key_file: ""
    client_ca_file: ""
  refresh_interval: 30 # seconds between polls

ecobee:
  pairing_store: "ecobee-pairing.json" # written by cmd/pair - see README
  accessory_name: "ecobee" # matches cmd/pair's --name flag, defaults to "ecobee" if omitted

  thermostat:
    id: ecobee-main
    name: "Main Floor Thermostat"

  sensors:
    - id: ecobee-downstairs
      name: Downstairs
      accessory_id: 4297248826 # HAP aid - see docs/ecobee-hap-dump.txt
