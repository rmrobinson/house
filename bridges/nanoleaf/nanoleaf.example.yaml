bridge:
  id: "<bridge ID>"
  listen_port: 17015
  # Optional: mutual TLS for this bridge's gRPC server. Leave all three
  # blank (the default) to serve plaintext gRPC. cert_file/key_file are
  # this bridge's own identity; client_ca_file is the CA (e.g. step-ca's
  # root) trusted to sign a connecting client's (facade's) certificate.
  tls:
    cert_file: ""
    key_file: ""
    client_ca_file: ""

nanoleaf:
  devices:
    - id: nanoleaf-living-room
      name: "Living Room Panels"
      host: 192.168.1.50
      # port defaults to 16021 (Nanoleaf's standard control port) if omitted
      api_key: "<API key from cmd/pair>"

    - id: nanoleaf-office
      name: "Office Panels"
      host: 192.168.1.51
      api_key: "<API key from cmd/pair>"
