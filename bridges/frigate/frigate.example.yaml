bridge:
  id: "<bridge ID>"
  listen_port: 17002
  # Optional: mutual TLS for this bridge's gRPC server. Leave all three
  # blank (the default) to serve plaintext gRPC. cert_file/key_file are
  # this bridge's own identity; client_ca_file is the CA (e.g. step-ca's
  # root) trusted to sign a connecting client's (facade's) certificate.
  tls:
    cert_file: ""
    key_file: ""
    client_ca_file: ""
  refresh_interval: 60
frigate:
  ip: "192.168.1.100"
  port: 5000
  proto: "http"
  # go2rtc's HTTP API port, used to build each camera's WHEP (WebRTC) restream
  # endpoint. go2rtc's default is 1984; omit to use that default.
  restream_http_port: 1984
  # Object labels that make a camera report motion on its presence trait. Only objects Frigate considers
  # actively moving count - a parked car or someone sitting still does not. Defaults to just "person".
  motion_labels:
    - person
  cameras:
    - name: "camera-one"
      manufacturer: "Manufacturer 1"
      model_id: "Model 1"
    - name: "camera-two"
      manufacturer: "Second manufacturer"
      model_id: "Model 2"