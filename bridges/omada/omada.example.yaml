bridge:
  id: "<bridge ID>"
  listen_port: 17007
  # Optional: mutual TLS for this bridge's gRPC server. Leave all three
  # blank (the default) to serve plaintext gRPC. cert_file/key_file are
  # this bridge's own identity; client_ca_file is the CA (e.g. step-ca's
  # root) trusted to sign a connecting client's (facade's) certificate.
  tls:
    cert_file: ""
    key_file: ""
    client_ca_file: ""
  refresh_interval: 60
omada:
    allow_insecure_tls: true
    oauth:
        cid: <Omada CID>
        client_id: <OAuth client ID>
        client_secret: <OAuth client secret>
    ip: <Omada IP>
    port: 8043
    proto: <https|http>
    site_id: <ID of the site to monitor> 