bridge:
  id: "<bridge ID>"
  listen_port: 17021
  # Optional: mutual TLS for this bridge's gRPC server. Leave all three
  # blank (the default) to serve plaintext gRPC. cert_file/key_file are
  # this bridge's own identity; client_ca_file is the CA (e.g. step-ca's
  # root) trusted to sign a connecting client's (facade's) certificate.
  tls:
    cert_file: ""
    key_file: ""
    client_ca_file: ""

cast:
  # devices is optional if discovery.mdns_enabled is true below — anything
  # listed here is authoritative (name/kind aren't overridden by discovery),
  # and discovery only adds UUIDs not listed here / refreshes their host.
  # Useful for pinning a friendly name or kind, or for devices discovery
  # can't see (a different VLAN, mDNS reflection disabled, etc).
  devices:
    - uuid: e393da5086494695baabe62713a0ee57
      host: 192.168.1.40
      name: "Kitchen Speaker"
      kind: media_player # or "television"; defaults to media_player if omitted
    - uuid: 0e0d6fa4b90349f9a3e83ac3d2e2c111
      host: 192.168.1.41
      name: "Living Room TV"
      kind: television

  discovery:
    # If true, the bridge does a single mDNS browse for _googlecast._tcp at
    # startup and merges what it finds into devices above (by UUID) — new
    # devices are added using their mDNS friendly name/address, and devices
    # already listed above just get their host address refreshed. Devices
    # are never removed based on what a browse does or doesn't see. With
    # this enabled and no devices listed above, the bridge runs against
    # whatever's discovered with no manual config at all. Off by default.
    mdns_enabled: false

  # Optional: proxies album/show art so dashboard clients never fetch a
  # remote CDN directly. Omit both to leave art URLs pointing at the
  # original upstream (Google/app CDN) address instead.
  art_base_url: "http://192.168.1.50:17023" # this bridge's own LAN address
  art_listen_port: 17023 # defaults: bridge 17021, media 17022, art 17023

  # Optional: serves the files in this directory over plain HTTP at
  # http://<this host>:<media_listen_port>/<file>, so a PlayMedia command's
  # content_url can point at a copy on the LAN. The speaker fetches the URL
  # itself, so once playback has started (and with repeat on) it keeps going
  # through an internet outage. Starting playback with the internet already
  # down also worked on a Google Home Mini (the media receiver app may have
  # been cached on the device; a cold start after long idle is unverified).
  # Omit media_dir to not serve anything. media_listen_port must differ from
  # bridge.listen_port and art_listen_port (the bridge refuses to start
  # otherwise), and from any other service on the same host.
  media_dir: ""
  media_listen_port: 17022
