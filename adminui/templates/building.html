{{define "content"}}
<div id="page-content">
  <div class="entity-header">
    <p class="crumbs"><a href="/buildings">Buildings</a> / <strong>{{.Building.Name}}</strong></p>
    <button type="button" class="icon-btn" title="Edit building" onclick="document.getElementById('edit-building-dialog').showModal()">⚙</button>
    <button type="button" class="icon-btn" title="Add floor" onclick="document.getElementById('add-floor-dialog').showModal()">+</button>
  </div>

  <dialog id="edit-building-dialog">
    <h3>Edit building</h3>
    <form hx-post="/buildings/{{.Building.ID}}" hx-target="#page-content" hx-swap="outerHTML">
      <input type="hidden" name="version" value="{{.Building.Version}}">
      <input type="hidden" name="lat" value="{{.Building.Lat}}">
      <input type="hidden" name="lon" value="{{.Building.Lon}}">
      <label>Name <input type="text" name="name" value="{{.Building.Name}}" required></label>
      <label>Timezone <input type="text" name="tz" value="{{.Building.TZ}}" placeholder="America/Toronto"></label>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" onclick="this.closest('dialog').close()">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
    <div class="panel-danger">
      <form hx-post="/buildings/{{.Building.ID}}/delete" hx-target="#page-content" hx-swap="outerHTML" hx-confirm="Delete this building?">
        <input type="hidden" name="version" value="{{.Building.Version}}">
        <button type="submit" class="danger">Delete building</button>
      </form>
    </div>
  </dialog>

  <dialog id="add-floor-dialog">
    <h3>Add floor</h3>
    <form hx-post="/buildings/{{.Building.ID}}/floors" hx-target="#page-content" hx-swap="outerHTML">
      <label>Name <input type="text" name="name" required></label>
      <label>Sort order <input type="number" name="sort_order" value="0"></label>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" onclick="this.closest('dialog').close()">Cancel</button>
        <button type="submit">Create</button>
      </div>
    </form>
  </dialog>

  <table>
    <thead><tr><th>Name</th><th>Sort order</th><th></th></tr></thead>
    <tbody>
    {{range .Floors}}
      <tr>
        <td><a href="/floors/{{.ID}}">{{.Name}}</a></td>
        <td>{{.SortOrder}}</td>
        <td><button type="button" class="link-btn" onclick="document.getElementById('edit-floor-dialog-{{.ID}}').showModal()">edit</button></td>
      </tr>
    {{else}}
      <tr><td colspan="3">No floors yet.</td></tr>
    {{end}}
    </tbody>
  </table>

  {{range .Floors}}
  <dialog id="edit-floor-dialog-{{.ID}}">
    <h3>Edit floor</h3>
    <form hx-post="/floors/{{.ID}}" hx-target="#page-content" hx-swap="outerHTML">
      <input type="hidden" name="version" value="{{.Version}}">
      <label>Name <input type="text" name="name" value="{{.Name}}" required></label>
      <label>Sort order <input type="number" name="sort_order" value="{{.SortOrder}}"></label>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" onclick="this.closest('dialog').close()">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
    <div class="panel-danger">
      <form hx-post="/floors/{{.ID}}/delete" hx-target="#page-content" hx-swap="outerHTML" hx-confirm="Delete this floor?">
        <input type="hidden" name="version" value="{{.Version}}">
        <button type="submit" class="danger">Delete floor</button>
      </form>
    </div>
  </dialog>
  {{end}}
</div>
{{end}}
