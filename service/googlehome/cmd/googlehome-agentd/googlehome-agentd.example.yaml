googlehome:
  # BridgeService endpoint to translate against - a single bridge, a
  # standalone bridgefacaded, or a housed process with the facade embedded
  # (this agent doesn't distinguish, same convention as service/policy/
  # bridgehome.Adapter).
  bridge_addr: "<bridge-service-host>:1337"

  # googlehomed's RelayService address - see cmd/googlehomed's own
  # googlehomed.example.yaml.
  relay_addr: "<public-host>:17060"

  # Must match googlehome.agent_user_id in googlehomed's config.
  agent_id: "<agent user id>"

  # Optional, together: HouseService endpoint + the single building to list
  # rooms under (house is single-building, same convention as policyd's
  # --house-addr/--building-id). Lets SYNC set each device's RoomHint from
  # its room assignment - the only way Google Home can tell apart two
  # devices that otherwise share a display name. Leave both unset if
  # bridge_addr points at a standalone bridgefacaded rather than housed -
  # there's no HouseService to ask in that topology, same gap the
  # google_home_visible toggle already has.
  house_addr: ""
  building_id: ""

  # Optional: mutual TLS, one identity for every role this agent dials -
  # bridge_addr, relay_addr, and house_addr alike - same convention as
  # policyd's --tls-cert/--tls-key/--tls-ca. Leave all blank (the default)
  # to speak plaintext gRPC.
  tls:
    cert_file: ""
    key_file: ""
    ca_file: ""
    # Required only if bridge_addr/relay_addr/house_addr isn't the
    # hostname the peer's own certificate was actually issued for.
    server_name: ""
