viewerui:
  listen_port: 8081
  # Address of housed's HouseService.
  house_addr: "192.168.1.5:1337"
  # Address of the BridgeService facade. Defaults to house_addr if unset.
  bridge_facade_addr: ""
  # Optional: STUN/TURN urls for the camera player, only needed to view
  # cameras from outside the LAN. e.g. ["stun:stun.l.google.com:19302"]
  ice_servers: []
  # Optional: weather-server (github.com/rmrobinson/weather-server) gRPC address,
  # for the overview's exterior climate. Plaintext unless weather_tls is true
  # (TLS against system roots, e.g. its nginx front on :443); weather_psk is
  # only needed if that server runs with WEATHER_PSK.
  weather_addr: ""
  weather_tls: false
  # CA that signed the weather server's certificate; empty = system roots. The
  # house CA (e.g. tls.ca_file) if it is signed by the internal CA.
  weather_ca_file: ""
  weather_psk: ""
  # Optional: metricsd's MetricsService (its listen_port, default 17050), for
  # the sparklines under each device's readings. Unset = no sparklines. Dialed
  # with the mutual-TLS identity below; metrics_server_name overrides the name
  # checked against its certificate for this connection only (empty = the
  # host in the address), since tls.server_name names housed.
  metrics_addr: ""
  metrics_server_name: ""
  # bcrypt hash of the PIN asked for before the viewer opens the garage door
  # (OPEN, and the position-unknown TRIGGER; CLOSE never asks). Unset = those
  # buttons are refused. Make one with: htpasswd -bnBC 10 "" 1234 | tr -d ':\n'
  # Keep it in the sibling secrets file: door_pin_hash: !secret door_pin_hash
  # After 5 wrong PINs in a row it locks for 30s, doubling each further miss
  # (max 15m) - for everyone, since requests arrive via the reverse proxy.
  door_pin_hash: ""
  # Optional: mutual TLS for every dial above - same shape as adminui.tls.
  tls:
    cert_file: ""
    key_file: ""
    ca_file: ""
    server_name: ""
