{{define "camera"}}<div class="box">
  <div class="box-title">{{.Name}}</div>
  {{if .URL}}
  <video id="cam" autoplay muted playsinline controls data-whep="{{.URL}}" data-ice="{{.ICEServers}}"></video>
  <div id="cam-status" class="pad dim">connecting…</div>
  <script>
  (async () => {
    const v = document.getElementById('cam'), st = document.getElementById('cam-status');
    const pc = new RTCPeerConnection({iceServers: JSON.parse(v.dataset.ice).map(u => ({urls: u}))});
    // go2rtc's WHEP endpoint returns no Location header, so there is no session
    // to DELETE; it frees the stream when the peer connection closes.
    const close = () => pc.close();
    pc.ontrack = e => { v.srcObject = e.streams[0]; };
    pc.onconnectionstatechange = () => { st.textContent = pc.connectionState; };
    pc.addTransceiver('video', {direction: 'recvonly'});
    pc.addTransceiver('audio', {direction: 'recvonly'});
    // Tear down when the pane is swapped away or the page is left. Watch only
    // the detail pane's parent, not the whole document.
    const gone = new MutationObserver((_, o) => { if (!v.isConnected) { close(); o.disconnect(); } });
    gone.observe(document.getElementById('detail') || document.body, {childList: true, subtree: true});
    addEventListener('pagehide', close, {once: true});
    try {
      await pc.setLocalDescription(await pc.createOffer());
      // Non-trickle: wait for ICE gathering so the single POST carries every candidate.
      await new Promise(res => {
        if (pc.iceGatheringState === 'complete') return res();
        pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && res();
        setTimeout(res, 2000);
      });
      const r = await fetch(v.dataset.whep, {method: 'POST', headers: {'Content-Type': 'application/sdp'}, body: pc.localDescription.sdp});
      if (!r.ok) throw new Error('WHEP ' + r.status);
      await pc.setRemoteDescription({type: 'answer', sdp: await r.text()});
    } catch (err) {
      close();
      st.textContent = 'failed: ' + err.message;
      st.className = 'pad err';
    }
  })();
  </script>
  {{else}}
  <div class="pad err">{{.Message}}</div>
  {{end}}
  <div class="pad"><button class="action" hx-get="/rooms/{{.RoomID}}" hx-target="#detail" hx-swap="innerHTML">[ BACK ]</button></div>
</div>{{end}}
