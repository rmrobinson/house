{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House</title>
<script src="/static/htmx.min.js"></script>
<script src="/static/htmx-sse.js"></script>
<style>
  :root { color-scheme: dark; --bg: #0b0d0c; --fg: #c9d4cc; --dim: #6b7a70; --line: #2a332d; --accent: #6fe39a; --warn: #e3b86f; --err: #e36f6f; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width: 1100px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
  h1 { font-size: 1rem; letter-spacing: 0.2em; margin: 0 0 1rem; color: var(--accent); }
  a, a:visited { color: var(--fg); text-decoration: none; }
  a:hover { color: var(--accent); }
  .dim { color: var(--dim); }
  .box { border: 1px solid var(--line); margin-bottom: 1rem; }
  .box-title { padding: 0.25rem 0.75rem; border-bottom: 1px solid var(--line); color: var(--dim); letter-spacing: 0.15em; font-size: 0.75rem; }
  .cols { display: grid; grid-template-columns: minmax(14rem, 18rem) 1fr; gap: 1rem; margin-bottom: 1rem; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { border-bottom: 1px solid var(--line); }
  ul.list li:last-child { border-bottom: none; }
  ul.list li > a, ul.list li > button.row { display: block; width: 100%; box-sizing: border-box; text-align: left; padding: 0.4rem 0.75rem; background: none; border: none; color: inherit; font: inherit; cursor: pointer; }
  ul.list li.active > a, ul.list li.active > button.row { color: var(--accent); background: #121815; }
  ul.list li > a:hover, ul.list li > button.row:hover { background: #121815; }
  .log { max-height: 12rem; overflow-y: auto; padding: 0.25rem 0.75rem; color: var(--dim); font-size: 0.8rem; }
  .dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.5rem; border: 1px solid var(--dim); }
  .dot-yes { background: var(--accent); border-color: var(--accent); }
  .dot-no { background: transparent; }
  .dot-unknown { border-style: dotted; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); }
  .stat { padding: 0.5rem 0.75rem; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat .label { color: var(--dim); font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; }
  .stat.alert .val { color: var(--err); }
  .stat .val { font-size: 1.1rem; }
  table.devices { width: 100%; border-collapse: collapse; }
  table.devices td { padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--line); }
  .badge { font-size: 0.7rem; color: var(--dim); border: 1px solid var(--line); padding: 0 0.3rem; margin-left: 0.4rem; }
  .offline { color: var(--err); border-color: var(--err); }
  button { font: inherit; }
  button.toggle, button.action { background: none; border: 1px solid var(--line); color: var(--fg); padding: 0.1rem 0.6rem; cursor: pointer; }
  button.toggle.on { color: var(--accent); border-color: var(--accent); }
  button.toggle:hover, button.action:hover { border-color: var(--fg); }
  .err { color: var(--err); font-size: 0.8rem; }
  video { width: 100%; background: #000; display: block; }
  output.level { display: inline-block; min-width: 3rem; margin-right: 0.6rem; text-align: right; }
  #status { position: fixed; top: 0.5rem; right: 0.75rem; font-size: 0.7rem; letter-spacing: 0.15em; color: var(--dim); }
  #status.down { color: var(--err); }
  #flash { position: fixed; bottom: 0; left: 0; right: 0; padding: 0.5rem 1rem; background: #1a1010; border-top: 1px solid var(--err); color: var(--err); }
  .box-title button.row { background: none; border: none; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; padding: 0; cursor: pointer; }
  .stats:empty::after { content: "No readings"; color: var(--dim); padding: 0.5rem 0.75rem; }
  .title-bar { display: flex; justify-content: space-between; align-items: center; }
  dialog { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 0; min-width: min(20rem, 90vw); }
  dialog::backdrop { background: rgba(0, 0, 0, 0.65); }
  .pad { padding: 0.5rem 0.75rem; }
  .nowplaying { padding: 0.5rem 0.75rem; border-top: 1px solid var(--line); color: var(--accent); }
  .nowplaying[hidden] { display: none; }
  input.dimmer, input.volume { width: 7rem; vertical-align: middle; margin-right: 0.6rem; accent-color: var(--accent); }
  table.devices td:last-child:not([colspan]) { white-space: nowrap; width: 1%; }
  tr.readings td { padding: 0 0.75rem 0.4rem 2rem; font-size: 0.72rem; opacity: 0.7; }
  tr.readings td::before { content: "\21b3"; margin-right: 0.5rem; color: var(--dim); }
  html:not(.hide-readings) table.devices tr:has(+ tr.readings:not([hidden])) td { border-bottom: none; }
  tr.readings[hidden], html.hide-readings tr.readings { display: none; }
  .reading { margin-right: 1.25rem; white-space: nowrap; }
  .reading.alert { color: var(--err); }
  button.action[aria-pressed="false"] { color: var(--dim); }
  button.action:disabled, button.toggle:disabled { opacity: 0.35; cursor: default; border-color: var(--line); }
  button.action:disabled:hover, button.toggle:disabled:hover { border-color: var(--line); }
</style>
</head>
<body>
<div id="status" role="status">connecting</div>
<div id="flash" role="alert" hidden></div>
<main>
{{template "content" .}}
</main>
<script>
// Clicking a room moves the active marker; the room list itself isn't
// re-rendered by a room swap (only the detail pane is).
document.addEventListener('click', function (e) {
  var b = e.target.closest('#room-list button.row');
  var s = e.target.closest('button[data-room]'); // a room opened from the floor summary
  if (s) b = document.querySelector('#room-list button.row[hx-get="/rooms/' + s.dataset.room + '"]');
  if (!b) return;
  document.querySelectorAll('#room-list li.active').forEach(function (l) { l.classList.remove('active'); });
  b.parentElement.classList.add('active');
});

// Live-update status. SSE pushes only deltas, so after a drop the page is
// stale; reload on reconnect (the room selection survives via push-url).
var sawError = false;
document.addEventListener('htmx:sseOpen', function () {
  if (sawError) { location.reload(); return; }
  setStatus('live', false);
});
document.addEventListener('htmx:sseError', function () {
  sawError = true;
  setStatus('disconnected', true);
});
function setStatus(text, down) {
  var s = document.getElementById('status');
  s.textContent = text;
  s.className = down ? 'down' : '';
}

// htmx doesn't swap 4xx/5xx responses, so surface them in a banner.
var flashTimer;
function flash(msg) {
  var f = document.getElementById('flash');
  f.textContent = msg;
  f.hidden = false;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function () { f.hidden = true; }, 6000);
}
document.addEventListener('htmx:responseError', function (e) {
  flash((e.detail.xhr.responseText || '').trim() || 'Request failed (' + e.detail.xhr.status + ')');
});
document.addEventListener('htmx:sendError', function () { flash('Unable to reach the server'); });

// Live level readout while dragging a dimmer or volume slider (the command
// goes out on release). Brightness is always a 0-100 percentage; volume's
// range is whatever the device reports (Volume.Attributes.maximum_level),
// so only the dimmer gets a "%" suffix.
document.addEventListener('input', function (e) {
  if (e.target.matches('input.dimmer')) {
    var o = e.target.nextElementSibling;
    if (o) o.textContent = e.target.value + '%';
  } else if (e.target.matches('input.volume')) {
    var o = e.target.nextElementSibling;
    if (o) o.textContent = e.target.value;
  }
});

// Don't let a live push redraw a row while the user is interacting with it
// (it would snap a slider back mid-drag).
document.addEventListener('htmx:oobBeforeSwap', function (e) {
  var t = e.detail.target;
  if (t && t.tagName === 'TR' && t.contains(document.activeElement) && document.activeElement.matches('input.dimmer, input.volume')) {
    e.detail.shouldSwap = false;
  }
});

// DETAILS toggle: show or hide every device's readings row. Remembered per
// browser; the room pane is swapped in by htmx, so the button's pressed state
// is re-synced on every load.
function readingsHidden() {
  try { return localStorage.getItem('viewerui.hideReadings') === '1'; } catch (e) { return false; }
}
function syncReadingsToggle() {
  var hidden = readingsHidden();
  document.documentElement.classList.toggle('hide-readings', hidden);
  document.querySelectorAll('button.readings-toggle').forEach(function (b) {
    b.setAttribute('aria-pressed', hidden ? 'false' : 'true');
  });
}
syncReadingsToggle();
document.addEventListener('htmx:load', syncReadingsToggle);
document.addEventListener('click', function (e) {
  if (!e.target.closest('button.readings-toggle')) return;
  try { localStorage.setItem('viewerui.hideReadings', readingsHidden() ? '0' : '1'); } catch (err) {}
  syncReadingsToggle();
});

// Cap the event log so a wall-mounted tab doesn't grow forever.
document.addEventListener('htmx:oobAfterSwap', function () {
  var log = document.getElementById('event-log');
  while (log && log.children.length > 100) log.lastElementChild.remove();
});
</script>
</body>
</html>{{end}}
