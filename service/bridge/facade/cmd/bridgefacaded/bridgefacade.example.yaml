bridge:
  id: "<bridge ID>"
  listen_port: 17020
  # The host downstream clients use to reach this facade - combined with
  # listen_port above to build the address published as the Address of
  # every device it proxies, so clients never need to dial an individual
  # upstream bridge directly.
  host: "192.168.1.5"
  # Optional: mutual TLS. Leave all three blank (the default) to speak
  # plaintext gRPC both ways. This facade plays two roles - a server to
  # whatever dials it (e.g. housed), and a client to every upstream bridge
  # in facade.bridges below - and reuses this one cert/key for both, since
  # it's a single principal ("this facade") either way. client_ca_file is
  # the CA (e.g. step-ca's root) trusted to sign both an inbound caller's
  # certificate and every upstream bridge's certificate.
  tls:
    cert_file: ""
    key_file: ""
    client_ca_file: ""

facade:
  bridges:
    # server_name is required whenever address isn't the name the upstream's
    # own certificate was actually issued for (e.g. dialing by IP, as below)
    # - see UpstreamBridge.ServerName. Omit it entirely for plaintext gRPC,
    # or whenever address already is that name.
    - address: "192.168.1.50:17010"
      server_name: "esphome.myhost.house.internal"
    - address: "192.168.1.51:17021"
      server_name: "cast.myhost.house.internal"
