adminui:
  listen_port: 8080
  # Optional: run every route under this path prefix instead of the site
  # root - e.g. "/admin" when a reverse proxy in front of this process
  # forwards that prefix here without stripping it first (see
  # app.go/templates.go for how every route/link/redirect picks this up).
  # Leave blank (the default) to serve at the site root exactly as before.
  base_path: ""
  # Address of housed's HouseService.
  house_addr: "192.168.1.5:1337"
  # Address of the BridgeService facade. Defaults to house_addr if unset -
  # the common case is housed embedding the facade on its own listener (see
  # service/house/cmd/housed/housed.example.yaml). Set this explicitly only
  # if the facade runs as its own bridgefacaded process.
  bridge_facade_addr: ""
  # Optional: address of a policyd instance's PolicyService, for the
  # /policies and /logs pages. Leave unset to run without the policy engine
  # UI - the Policies/Execution Log nav links stay dimmed with setup
  # instructions instead of erroring.
  policy_addr: ""
  # house_addr/bridge_facade_addr/policy_addr above only seed adminui's
  # first generation - the running app's own /settings page can change any
  # of them afterwards without a restart, and writes the change back here
  # (adminui rewrites this section of this exact file in place). tls below
  # isn't editable from /settings; it's set once at startup.
  # Optional: mutual TLS for every dial above. Leave all three blank (the
  # default) to speak plaintext gRPC. ca_file is the CA (e.g. step-ca's
  # root) trusted to sign housed's/the facade's/policyd's certificate.
  tls:
    cert_file: ""
    key_file: ""
    ca_file: ""
    # Required whenever house_addr/bridge_facade_addr isn't the same name
    # housed's (or the facade's) certificate was actually issued for - e.g.
    # dialing by IP or "localhost" while cert-agent issues it a cert for
    # "<name>.<host>.house.internal". Same pattern as housed's own
    # house.tls.server_name and facade.bridges' per-entry server_name - see
    # those for the general rationale.
    server_name: ""
