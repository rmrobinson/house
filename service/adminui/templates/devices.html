{{define "content"}}
<div id="page-content">
  <p class="filters">
    Show only:
    <a href="{{.Filter.ToggleUnlinked}}" class="filter-chip{{if .Filter.Unlinked}} filter-chip-on{{end}}">Unlinked</a>
    <a href="{{.Filter.ToggleConnected}}" class="filter-chip{{if .Filter.Connected}} filter-chip-on{{end}}">Connected</a>
    <span class="hint">{{len .Devices}} device{{if ne (len .Devices) 1}}s{{end}}</span>
  </p>

  <table>
    <thead><tr><th>Device</th><th>Manufacturer</th><th>Location</th><th></th></tr></thead>
    <tbody>
    {{range .Devices}}
      <tr>
        {{template "device_info" .}}
        <td>{{.Manufacturer}}{{if .Model}}<br><span class="hint">{{.Model}}</span>{{end}}</td>
        <td>{{.RoomName}}</td>
        <td>
          <button hx-get="/devices/{{.ID}}/room-picker" hx-target="#picker" hx-swap="innerHTML">
            {{if .RoomID}}Move{{else}}Link{{end}}
          </button>
        </td>
      </tr>
    {{else}}
      <tr><td colspan="4">No devices found.</td></tr>
    {{end}}
    </tbody>
  </table>
</div>
{{end}}
