house:
  db: /var/lib/house/house.db
  listen_port: 1337
  # Only used if the facade section below is absent - dials a
  # separately-running bridgefacaded instead of embedding one here.
  bridge_facade_addr: ""
  # Optional: mutual TLS. Leave all three blank (the default) to speak
  # plaintext gRPC both ways. Secures this listener (HouseService, and
  # BridgeService too if a facade is embedded below - they share one
  # gRPC server) and every outbound dial housed itself makes (to its own
  # embedded facade over loopback, or to house.bridge_facade_addr above) -
  # one principal ("housed") presenting the same identity either way.
  # client_ca_file is the CA (e.g. step-ca's root) trusted to sign an
  # inbound caller's certificate.
  tls:
    cert_file: ""
    key_file: ""
    client_ca_file: ""
    # Required (only) when TLS above is configured AND the facade section
    # below is used to embed a facade in this process: housed dials that
    # facade at "localhost", but its certificate was issued for its real
    # hostname (e.g. "housed.myhost.house.internal" per cert-agent's SAN
    # convention) - server_name tells the self-dial's TLS verification
    # which hostname to actually check the certificate against.
    server_name: ""

# Optional: embed a BridgeService facade in this same process, sharing
# house.listen_port instead of running service/bridge/facade/cmd/bridgefacaded
# as a separate process. Same shape as that binary's own config - see
# ../../../bridge/facade/cmd/bridgefacaded/bridgefacade.example.yaml. Omit
# this whole section (and bridge below) to run housed with no facade at all.
bridge:
  id: "<bridge ID>"
  # The host downstream clients use to reach this facade - combined with
  # house.listen_port above (HouseService and BridgeService are served from
  # the same listener here) to build the address published as the Address
  # of every device it proxies.
  host: "192.168.1.5"

facade:
  bridges:
    - "192.168.1.50:17010" # esphome bridge
    - "192.168.1.51:17021" # cast bridge
